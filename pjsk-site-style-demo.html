<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PJSK Site Style Demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #5b5b78;
        font-family: Montserrat, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #eefbff;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .bgarea {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }
      .bgarea--bgimage,
      .bgarea--bgimage-img,
      .bgarea--rellax {
        position: absolute;
        inset: 0;
      }
      .bgarea--bgimage-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
      }
      .pc-none {
        display: none;
      }
      .sp-none {
        display: block;
      }
      .bgarea--rellax-item1,
      .bgarea--rellax-item2,
      .bgarea--rellax-item3 {
        position: absolute;
        opacity: .55;
      }
      .bgarea--rellax-item1 {
        left: 8%;
        top: 42%;
        width: 0;
        height: 0;
        border-left: 92px solid rgba(255, 128, 203, .32);
        border-top: 62px solid transparent;
        border-bottom: 62px solid transparent;
        filter: blur(4px);
      }
      .bgarea--rellax-item2 {
        right: 8%;
        top: 56%;
        width: 0;
        height: 0;
        border-left: 44px solid transparent;
        border-right: 44px solid transparent;
        border-top: 72px solid rgba(158, 228, 236, .62);
      }
      .bgarea--rellax-item3 {
        left: 20%;
        top: 68%;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #78eadf;
        box-shadow:
          220px 110px 0 #ee8ac8,
          620px -180px 0 -2px #78eadf,
          980px 28px 0 5px rgba(255, 255, 255, .95);
      }
      .hero {
        height: 320px;
        background:
          linear-gradient(rgba(49, 54, 91, .55), rgba(49, 54, 91, .35)),
          radial-gradient(circle at 50% 75%, rgba(255,255,255,.65) 0 3px, transparent 4px 12px),
          linear-gradient(90deg, #69d8e9, #263462 52%, #5471bb);
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .hero::before {
        content: "ABOUT GAME";
        position: absolute;
        font-size: clamp(54px, 10vw, 128px);
        font-weight: 800;
        letter-spacing: 4px;
        color: transparent;
        -webkit-text-stroke: 2px rgba(255,255,255,.25);
      }
      .nav {
        position: absolute;
        inset: 0 0 auto;
        height: 86px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 7vw;
        background: rgba(65, 65, 101, .74);
        color: white;
        font-weight: 800;
      }
      .logo { color: #79efe3; font-size: 18px; line-height: 1; }
      .logo span { display: block; color: white; font-size: 12px; }
      .menu { display: flex; gap: 34px; font-size: 13px; }
      h1 {
        position: relative;
        color: white;
        font-size: clamp(34px, 5.6vw, 58px);
        letter-spacing: 6px;
        font-weight: 800;
        margin: 70px 0 0;
      }
      main {
        position: relative;
        min-height: calc(100vh - 320px);
        padding: 82px 7vw;
      }
      .tabs {
        display: flex;
        justify-content: center;
        gap: 22px;
        flex-wrap: wrap;
        margin-bottom: 80px;
      }
      .tab {
        min-width: 170px;
        padding: 16px 30px;
        border: 0;
        border-radius: 999px;
        color: #555777;
        background: white;
        box-shadow: 0 14px 18px rgba(54, 50, 86, .22);
        font-size: 15px;
        font-weight: 800;
      }
      .tab.active { color: #78eadf; background: #565778; }
      .copy { text-align: center; max-width: 900px; margin: 0 auto 76px; }
      .label, .headline {
        display: inline-block;
        background: #565778;
        color: white;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .label { padding: 12px 34px; color: #78eadf; font-size: 24px; }
      .headline { margin-top: 18px; padding: 12px 32px; font-size: clamp(24px, 3.8vw, 36px); }
      .headline.pink { color: #ff7ec7; }
      p { font-size: 16px; line-height: 1.8; }
      .social {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 52px 20px;
        background: #777793;
      }
      .social b { width: 100%; text-align: center; color: white; margin-bottom: 18px; font-size: 14px; }
      .social button {
        min-width: 170px;
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        background: #78eadf;
        color: #565778;
        font-weight: 700;
        font-size: 14px;
      }
      @media (max-width: 760px) {
        .sp-none { display: none; }
        .pc-none { display: block; }
        .menu { display: none; }
        .hero { height: 260px; }
        main { padding: 54px 22px; }
        .tab { min-width: 135px; font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <div class="bgarea" aria-hidden="true">
      <div class="bgarea--bgimage">
        <img src="./bg_lottie_pc.jpg" alt="HATSUNE MIKU" class="bgarea--bgimage-img sp-none" />
        <img src="./bg_lottie_sp.jpg" alt="HATSUNE MIKU" class="bgarea--bgimage-img pc-none" />
      </div>
      <div class="bgarea--rellax">
        <div class="bgarea--rellax-item1" style="transform: translate3d(0px, -24px, 0px);"></div>
      </div>
      <div class="bgarea--rellax">
        <div class="bgarea--rellax-item2" style="transform: translate3d(0px, 6px, 0px);"></div>
      </div>
      <div class="bgarea--rellax">
        <div class="bgarea--rellax-item3" style="transform: translate3d(0px, -15px, 0px);"></div>
      </div>
    </div>

    <section class="hero">
      <nav class="nav">
        <div class="logo">COLORFUL STAGE<span>style mock</span></div>
        <div class="menu"><span>ABOUT GAME</span><span>NEWS</span><span>CHARACTERS</span><span>MEDIA</span></div>
      </nav>
      <h1>ABOUT GAME</h1>
    </section>

    <main>
      <div class="tabs">
        <button class="tab active">STORY</button>
        <button class="tab">GAMEPLAY</button>
        <button class="tab">SHOWS</button>
        <button class="tab">MYSEKAI</button>
      </div>

      <section class="copy">
        <div class="label">"SEKAI"</div><br />
        <div class="headline">A PLACE WHERE YOU CAN FIND</div><br />
        <div class="headline pink">YOUR TRUE SELF ...</div>
        <p>Tokyo, Shibuya. Music, feelings, and stage lights connect in a soft pastel world.</p>
      </section>
    </main>

    <section class="social">
      <b>OFFICIAL SOCIAL MEDIA</b>
      <button>X (Twitter)</button><button>Facebook</button><button>Instagram</button>
      <button>YouTube</button><button>Discord</button><button>Twitch</button>
    </section>
  </body>
</html>
