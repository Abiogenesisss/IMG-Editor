appId: com.electron.app
productName: img-editor
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!python_backend'
  - '!scripts'
  - '!tests{,/**}'
  - '!.codex{,/**}'
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/LICENSE*'
  - '!**/CHANGELOG*'
extraResources:
  - from: python_backend
    to: python_backend
    filter:
      - '**/*'
      - '!__pycache__'
      - '!**/__pycache__'
      - '!**/*.pyc'
      - '!**/*.pyo'
      - '!models/tagger'
      - '!models/tagger/**'
      - '!models/deepghs'
      - '!models/deepghs/**'
      - '!waifu2x/pretrained_models'
      - '!waifu2x/pretrained_models/**'
      - '!python_embed/Include'
      - '!python_embed/Include/**'
      - '!python_embed/Scripts'
      - '!python_embed/Scripts/**'
      - '!python_embed/share'
      - '!python_embed/share/**'
      - '!python_embed/insightface'
      - '!python_embed/insightface/**'
      - '!python_embed/Lib/site-packages/pip'
      - '!python_embed/Lib/site-packages/pip/**'
      - '!python_embed/Lib/site-packages/pip-*.dist-info'
      - '!python_embed/Lib/site-packages/pip-*.dist-info/**'
      - '!python_embed/Lib/site-packages/setuptools'
      - '!python_embed/Lib/site-packages/setuptools/**'
      - '!python_embed/Lib/site-packages/setuptools-*.dist-info'
      - '!python_embed/Lib/site-packages/setuptools-*.dist-info/**'
      - '!python_embed/Lib/site-packages/wheel'
      - '!python_embed/Lib/site-packages/wheel/**'
      - '!python_embed/Lib/site-packages/wheel-*.dist-info'
      - '!python_embed/Lib/site-packages/wheel-*.dist-info/**'
asarUnpack:
  - resources/**
win:
  executableName: img-editor
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-portable.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Abiogenesisss
  repo: IMG-Editor
